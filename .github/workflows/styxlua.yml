name: styxlua

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build, test and publish
        working-directory: java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="1.0.0-${GITHUB_SHA::8}"
          ./gradlew --no-daemon check publish -Pstyxlua_version="$version"
          echo "Published com.payonel:styxlua:$version" >> "$GITHUB_STEP_SUMMARY"
