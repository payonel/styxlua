name: styxlua

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The version (the branch's commits, then the commit)
        run: echo "VERSION=1.0.$(git rev-list --count HEAD)-${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build, test and publish
        working-directory: java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$VERSION"
          ./gradlew --no-daemon check publish -Pstyxlua_version="$version"
          echo "Published com.payonel:styxlua:$version" >> "$GITHUB_STEP_SUMMARY"
